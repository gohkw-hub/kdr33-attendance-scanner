<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KDR33 Clinical Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  color: #111;
}

.header {
  background: #123b63;
  color: white;
  padding: 20px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.header p {
  margin: 6px 0 0;
  font-size: 14px;
}

.container {
  max-width: 650px;
  margin: 20px auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
  margin-bottom: 6px;
}

select,
input,
button {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border-radius: 8px;
}

select,
input {
  border: 1px solid #bbb;
  background: white;
}

button {
  border: none;
  cursor: pointer;
  font-weight: bold;
  margin-top: 12px;
}

.start {
  background: #123b63;
  color: white;
}

.stop {
  background: #777;
  color: white;
}

.next {
  background: #198754;
  color: white;
}

#videoContainer {
  display: none;
  position: relative;
  width: 100%;
  margin-top: 18px;
  overflow: hidden;
  border-radius: 14px;
  background: black;
}

#video {
  display: block;
  width: 100%;
}

#scanFrame {
  position: absolute;
  left: 10%;
  top: 20%;
  width: 80%;
  height: 60%;
  border: 4px solid #00e676;
  border-radius: 18px;
  pointer-events: none;
}

#scanCanvas {
  display: none;
}

#status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  background: #eef2f6;
  font-weight: bold;
  text-align: center;
}

#result {
  display: none;
  margin-top: 18px;
  padding: 18px;
  border-radius: 10px;
  background: #eaf7ee;
  border: 1px solid #8ac79b;
}

.result-row {
  margin: 7px 0;
}

.result-label {
  font-weight: bold;
}

.error {
  background: #fdecec !important;
  border-color: #e09a9a !important;
}

.success {
  background: #eaf7ee !important;
  border-color: #8ac79b !important;
}

.warning {
  background: #fff6df !important;
  border-color: #e3c36b !important;
}

.small {
  font-size: 13px;
  color: #555;
  margin-top: 8px;
  text-align: center;
}
</style>
</head>

<body>

<div class="header">
  <h1>KDR33 Clinical Attendance</h1>
  <p>Clinical Posting QR Attendance Scanner</p>
</div>

<div class="container">

  <div class="card">

    <label for="staff">Staff</label>

    <select id="staff">
      <option value="ST001">ST001 - STAFF1</option>
      <option value="ST002">ST002 - STAFF2</option>
    </select>

    <label for="reportingPoint">Reporting Point</label>

    <select id="reportingPoint">
      <option value="MU">MU</option>
      <option value="MS">MS</option>
      <option value="TR">TR</option>
      <option value="MRI">MRI</option>
    </select>

    <button class="start" id="startButton">
      START CAMERA
    </button>

    <button class="stop" id="stopButton" style="display:none;">
      STOP CAMERA
    </button>

    <div id="videoContainer">

      <video
        id="video"
        playsinline
        autoplay>
      </video>

      <div id="scanFrame"></div>

    </div>

    <canvas id="scanCanvas"></canvas>

    <div id="status">
      Camera not started.
    </div>

    <div class="small">
      Place the student's QR code inside the green frame.
    </div>

    <div id="result">

      <div class="result-row">
        <span class="result-label">Message:</span>
        <span id="resultMessage"></span>
      </div>

      <div class="result-row">
        <span class="result-label">Student ID:</span>
        <span id="studentId"></span>
      </div>

      <div class="result-row">
        <span class="result-label">Student:</span>
        <span id="studentName"></span>
      </div>

      <div class="result-row">
        <span class="result-label">Department:</span>
        <span id="department"></span>
      </div>

      <div class="result-row">
        <span class="result-label">Block:</span>
        <span id="block"></span>
      </div>

      <div class="result-row">
        <span class="result-label">Reporting Point:</span>
        <span id="point"></span>
      </div>

      <div class="result-row">
        <span class="result-label">Status:</span>
        <span id="attendanceStatus"></span>
      </div>

      <div class="result-row">
        <span class="result-label">Location Check:</span>
        <span id="locationCheck"></span>
      </div>

    </div>

    <button
      class="next"
      id="nextButton"
      style="display:none;">
      SCAN NEXT STUDENT
    </button>

  </div>

</div>

<iframe
  name="attendanceFrame"
  id="attendanceFrame"
  style="display:none;">
</iframe>

<form
  id="attendanceForm"
  method="POST"
  target="attendanceFrame"
  style="display:none;">

  <input name="qrId" id="formQrId">
  <input name="reportingPoint" id="formReportingPoint">
  <input name="staffId" id="formStaffId">
  <input name="remarks" id="formRemarks">

</form>

<script>

/* =========================================================
   APPS SCRIPT WEB APP
   ========================================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/a/macros/ummc.edu.my/s/AKfycbzv9OCeZMHdWuHluCUpD33UnyYEd0DP7JaiM6GPCJX-UnvKV3-CE0Mv7zcS-XmrRXeO/exec";


/* =========================================================
   ELEMENTS
   ========================================================= */

const video =
  document.getElementById("video");

const videoContainer =
  document.getElementById("videoContainer");

const canvas =
  document.getElementById("scanCanvas");

const canvasContext =
  canvas.getContext("2d", {
    willReadFrequently: true
  });

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const nextButton =
  document.getElementById("nextButton");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const staffSelect =
  document.getElementById("staff");

const reportingPointSelect =
  document.getElementById("reportingPoint");

const attendanceForm =
  document.getElementById("attendanceForm");

const attendanceFrame =
  document.getElementById("attendanceFrame");


/* =========================================================
   VARIABLES
   ========================================================= */

let stream = null;

let scanning = false;

let scanLocked = false;

let animationFrame = null;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "") {

  statusBox.textContent = message;

  statusBox.className = "";

  if (type === "error") {
    statusBox.classList.add("error");
  }

  if (type === "success") {
    statusBox.classList.add("success");
  }

  if (type === "warning") {
    statusBox.classList.add("warning");
  }
}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  try {

    if (!window.isSecureContext) {

      setStatus(
        "ERROR: Camera requires HTTPS.",
        "error"
      );

      return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      setStatus(
        "ERROR: Camera access is not supported by this browser.",
        "error"
      );

      return;
    }

    setStatus("Starting camera...");

    stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1280
        },
        height: {
          ideal: 720
        }
      },

      audio: false

    });

    video.srcObject = stream;

    videoContainer.style.display = "block";

    startButton.style.display = "none";

    stopButton.style.display = "block";

    nextButton.style.display = "none";

    resultBox.style.display = "none";

    scanLocked = false;

    scanning = true;

    await video.play();

    setStatus(
      "Camera active — scanning for QR code..."
    );

    requestAnimationFrame(scanFrame);

  } catch (error) {

    console.error(error);

    setStatus(
      "Camera error: " + error.message,
      "error"
    );

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  scanning = false;

  scanLocked = true;

  if (animationFrame) {

    cancelAnimationFrame(animationFrame);

    animationFrame = null;

  }

  if (stream) {

    stream.getTracks().forEach(
      track => track.stop()
    );

    stream = null;
  }

  video.srcObject = null;

  videoContainer.style.display = "none";

  startButton.style.display = "block";

  stopButton.style.display = "none";

}


/* =========================================================
   QR SCANNING
   ========================================================= */

function scanFrame() {

  if (!scanning) {
    return;
  }

  if (scanLocked) {
    return;
  }

  if (video.readyState !== video.HAVE_ENOUGH_DATA) {

    animationFrame =
      requestAnimationFrame(scanFrame);

    return;
  }


  /*
   * Use the actual camera resolution.
   */

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (!width || !height) {

    animationFrame =
      requestAnimationFrame(scanFrame);

    return;
  }


  /*
   * Put the current video frame into canvas.
   */

  canvas.width = width;

  canvas.height = height;

  canvasContext.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
   * Extract pixel data.
   */

  const imageData =
    canvasContext.getImageData(
      0,
      0,
      width,
      height
    );


  /*
   * Decode QR.
   */

  if (typeof jsQR !== "function") {

    setStatus(
      "ERROR: QR decoder did not load.",
      "error"
    );

    return;
  }


  const code =
    jsQR(
      imageData.data,
      imageData.width,
      imageData.height,
      {
        inversionAttempts: "attemptBoth"
      }
    );


  if (code && code.data) {

    console.log(
      "QR DETECTED:",
      code.data
    );

    handleQRCode(code.data);

    return;
  }


  /*
   * Continue scanning.
   */

  animationFrame =
    requestAnimationFrame(scanFrame);
}


/* =========================================================
   QR DETECTED
   ========================================================= */

function handleQRCode(qrData) {

  if (scanLocked) {
    return;
  }

  scanLocked = true;

  const qrId =
    String(qrData).trim();

  setStatus(
    "QR DETECTED: " + qrId,
    "success"
  );

  submitAttendance(qrId);
}


/* =========================================================
   SUBMIT ATTENDANCE
   ========================================================= */

function submitAttendance(qrId) {

  const staffId =
    staffSelect.value;

  const reportingPoint =
    reportingPointSelect.value;


  /*
   * Fill hidden form.
   */

  document.getElementById(
    "formQrId"
  ).value = qrId;

  document.getElementById(
    "formReportingPoint"
  ).value = reportingPoint;

  document.getElementById(
    "formStaffId"
  ).value = staffId;

  document.getElementById(
    "formRemarks"
  ).value = "";


  setStatus(
    "QR detected. Recording attendance..."
  );


  /*
   * Submit to Apps Script.
   */

  attendanceForm.action =
    APPS_SCRIPT_URL;

  attendanceForm.submit();


  /*
   * Wait for Apps Script response.
   */

  setTimeout(function() {

    if (scanLocked) {

      setStatus(
        "Attendance request sent. Waiting for response..."
      );

    }

  }, 500);

}


/* =========================================================
   APPS SCRIPT RESPONSE
   ========================================================= */

window.addEventListener(
  "message",
  function(event) {

    /*
     * Accept only Google Apps Script origins.
     */

    const allowedOrigins = [
      "https://script.google.com",
      "https://script.googleusercontent.com"
    ];

    if (!allowedOrigins.includes(event.origin)) {
      return;
    }


    if (!event.data) {
      return;
    }


    if (
      event.data.type !==
      "KDR33_ATTENDANCE_RESULT"
    ) {
      return;
    }


    const result =
      event.data.result;


    if (!result) {
      return;
    }


    displayResult(result);

  }
);


/* =========================================================
   DISPLAY RESULT
   ========================================================= */

function displayResult(result) {

  resultBox.style.display = "block";

  document.getElementById(
    "resultMessage"
  ).textContent =
    result.message || "";


  document.getElementById(
    "studentId"
  ).textContent =
    result.studentId || "";


  document.getElementById(
    "studentName"
  ).textContent =
    result.studentName || "";


  document.getElementById(
    "department"
  ).textContent =
    result.department || "";


  document.getElementById(
    "block"
  ).textContent =
    result.block || "";


  document.getElementById(
    "point"
  ).textContent =
    result.reportingPoint || "";


  document.getElementById(
    "attendanceStatus"
  ).textContent =
    result.status || "";


  document.getElementById(
    "locationCheck"
  ).textContent =
    result.locationCheck || "";


  if (result.success) {

    setStatus(
      result.message ||
      "Attendance recorded successfully.",
      "success"
    );

  } else {

    setStatus(
      result.message ||
      "Attendance could not be recorded.",
      "error"
    );

  }


  /*
   * Stop camera after a successful scan.
   */

  stopCamera();

  nextButton.style.display = "block";

}


/* =========================================================
   SCAN NEXT STUDENT
   ========================================================= */

nextButton.addEventListener(
  "click",
  function() {

    resultBox.style.display = "none";

    nextButton.style.display = "none";

    scanLocked = false;

    startCamera();

  }
);


/* =========================================================
   BUTTONS
   ========================================================= */

startButton.addEventListener(
  "click",
  startCamera
);

stopButton.addEventListener(
  "click",
  function() {

    stopCamera();

    setStatus(
      "Camera stopped."
    );

  }
);


/* =========================================================
   INITIAL STATUS
   ========================================================= */

if (typeof jsQR === "function") {

  setStatus(
    "Ready. Select reporting point and start camera."
  );

} else {

  setStatus(
    "WARNING: QR decoder is still loading. Please refresh the page.",
    "warning"
  );

}

</script>

</body>
</html>
